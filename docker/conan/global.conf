# Fetch sources from their upstream hosts first. ConanCenter's backup-sources mirror is kept as a
# fallback: it was listed first because upstream hosts (gitlab.dkrz.de for libaec, among others)
# answer GitHub runners with HTTP 429 when many jobs build at once, but since October 2026 it
# answers 401 (authentication required), which fails the download instead of falling back.
core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]
core.download:retry=5
core.download:retry_wait=15
